services:
  app:
    build: .
    image: pupitre
    env_file: .env
    ports:
      # Écoute en local uniquement : exposez l'appli via un reverse proxy HTTPS.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/connexion', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    image: pupitre
    env_file: .env
    environment:
      SKIP_MIGRATIONS: "1"
    volumes:
      - ./data:/data
    command: ["sh", "-c", "while true; do flask run-reminders || true; sleep 900; done"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
